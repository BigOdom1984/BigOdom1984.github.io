<style>
:root{--ink:#172d2b;--muted:#596d68;--paper:#f5f0e6;--white:#fffdf8;--lime:#c9ed72;--line:#d8d4c9;--deep:#193d39}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 5vw;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font-weight:950;text-decoration:none;font-size:1.4rem;letter-spacing:-.06em;color:var(--ink)}
.brand span{color:#d35f48}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{font-weight:800;text-decoration:none;color:var(--ink)}
.hero{padding:70px 7vw;background:var(--deep);color:#fff}
.hero small{color:var(--lime);letter-spacing:.15em;text-transform:uppercase;font-weight:900}
.hero h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.07em;line-height:.95;margin:14px 0}
.hero p{max-width:700px;color:#d5e2d9}
.wrap{max-width:1200px;margin:auto;padding:55px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;min-height:260px;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.ghost-pill,.ghost-title,.ghost-list,.ghost-copy{filter:blur(5px);opacity:.30;pointer-events:none}
.ghost-pill{height:13px;width:88px;border-radius:99px;background:#8d9d91}
.ghost-title{height:22px;width:58%;border-radius:7px;background:#667c70}
.ghost-list{background:#172d2b;border-radius:12px;padding:16px;display:grid;gap:12px;flex:1}
.ghost-list i,.ghost-copy i{display:block;height:7px;border-radius:99px;background:#c9ed72}
.ghost-list i:nth-child(2n){width:74%}.ghost-list i:nth-child(3n){width:88%}
.ghost-copy{display:grid;gap:9px}
.ghost-copy i{background:#9aa99f;width:95%}.ghost-copy i:last-child{width:62%}
footer{text-align:center;padding:35px;background:var(--deep);color:#d5e2d9}
footer a{color:var(--lime)}
@media(max-width:600px){header{flex-direction:column}nav{gap:14px}.wrap{padding:42px 18px}}
</style>
