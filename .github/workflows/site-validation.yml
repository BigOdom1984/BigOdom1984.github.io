name: CashDublo website validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate navigation, responsive layout and hosting configuration
        run: |
          node --check assets/cashdublo-nav.js
          node --check assets/site-navigation.js
          node --check site.js
          node tests/navigation-contract.test.cjs
          node tests/responsive-layout.test.mjs
          node tests/root-site-upgrade.test.mjs
